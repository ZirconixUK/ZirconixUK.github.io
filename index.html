<!DOCTYPE html>
<html lang="en">
 <head>

   The Circle
  </title>

  <!-- Tailwind CDN -->

  <style type="text/tailwindcss">
   @layer components {
     /* add vertical spacing between immediate child divs */

	   .typewriter-text > * + * {

         @apply bg-[#3b2f1f] text-[#F6F1E0] p-4 rounded-lg border border-[#CFAE6A] ;
      }

         @apply bg-[#F6F1E0] text-[#333333] p-4 rounded-lg border border-[#CFAE6A] ;
		 font-family: 'Special Elite', cursive;
      }

    @apply list-disc list-inside mb-2;
		}

     .path-btn {
        @apply inline-block bg-[#F6F1E0] text-[#3b2f1f] px-4 py-2 rounded-lg border border-[#CFAE6A] font-semibold shadow-inner shadow-black/20 shadow-md hover:bg-[#E3D1B5] transition-colors;
   
      }
    
	.instructions-text ul li {
	  @apply mt-1;
	}
      .grandad-text {
        @apply bg-[#F6F1E0] text-[#333333] p-4 rounded-lg border border-[#CFAE6A] ;
		font-family: 'Architects Daughter';

	  /* add vertical spacing between immediate child divs */
      .grandad-text > * + * {
        @apply mt-3;
      }
	   .handwritten-text {
        @apply bg-[#F6F1E0] text-[#333333] p-4 rounded-lg border border-[#CFAE6A]  text-2xl;
		font-family: 'Reenie Beanie';
      }
	  /* add vertical spacing between immediate child divs */
      .handwritten-text > * + * {
        @apply mt-3;
      }
	  	   .handwritten-friendly-text {
        @apply bg-[#F6F1E0] text-[#333333] p-4 rounded-lg border border-[#CFAE6A]  text-lg;
		font-family: 'Indie Flower';
      }
	  /* add vertical spacing between immediate child divs */
      .handwritten-friendly-text > * + * {
        @apply mt-3;
      }
	     .script-text {
        @apply bg-[#F6F1E0] text-[#333333] p-4 rounded-lg border border-[#CFAE6A] text-xl;

 </head>
 <body class="bg-[url('/assets/wood.jpg')] bg-repeat bg-center text-white font-sans p-4 text-center">
  <!-- Hint Tab & Reset Icon -->
  <div class="fixed bottom-16 right-0 flex items-center bg-[#3D5B3D] shadow-[7px_7px_10px_rgba(0,0,0,0.5)] rounded-l-lg pl-1 pr-0 py-1 cursor-pointer z-50" onclick="showHint()">
   <div class="border-l-2 border-t-2 border-b-2 border-dashed border-gray-400 border-r-0 py-1 pl-2 pr-0 rounded-r">
    <span class="text-2xl">
     🔍
    </span>
   </div>
  </div>
  <div class="fixed top-5 left-5 text-2xl cursor-pointer z-50" onclick="resetProgress()">
   🔄
  </div>
  <!-- Navigation Controls -->
  <div class="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-6 mb-6" id="navControls">
   <button class="px-6 py-2 rounded-lg bg-[#5B2A2A] border-2 border-[#CFAE6A] text-[#F6F1E0] uppercase tracking-wider font-semibold shadow-inner shadow-black/25 hover:bg-[#4A2020] hover:ring-1 hover:ring-[#CFAE6A] transition" id="togglePathBtn" onclick="togglePath()">
    Switch Path
   </button>
   <label class="font-medium" for="stageSelect">
   </label>
   <div class="relative inline-block">
    <select class="appearance-none w-full bg-[#F6F1E0] text-[#333333] border border-[#CFAE6A] rounded-lg py-2 px-3 pr-8 leading-tight shadow-inner shadow-black/10 focus:outline-none focus:ring-[1px] focus:ring-[#CFAE6A] transition" id="stageSelect" onchange="onStageChange(this.value)">
    </select>
    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2">
     <svg class="w-4 h-4 text-[#CFAE6A]" fill="currentColor" viewbox="0 0 20 20">
      <path d="M5.5 7.5L10 12l4.5-4.5L16 8l-6 6-6-6z">
      </path>
     </svg>
    </div>
   </div>
  </div>
  <!-- Text Content -->
  <div class="filter drop-shadow-2xl max-w-3xl mx-auto mb-6 text-left text-lg space-y-4 hidden" id="textContent">
  </div>
  <!-- Images & Choices -->
  <div class="images mb-6">
   <div class="flex">
    <img alt="Puzzle Image 1" class="w-1/2 h-auto cursor-pointer" id="img1" onclick="showOverlay(this.src)" src=""/>
    <img alt="Puzzle Image 2" class="w-1/2 h-auto cursor-pointer" id="img2" onclick="showOverlay(this.src)" src=""/>
   </div>
   <div class="mt-4 flex justify-center gap-8">
    <span class="text-blue-600 underline cursor-pointer hidden" id="choiceParallel" onclick="choosePath('parallel')">
     Parallel Path
    </span>
    <span class="text-blue-600 underline cursor-pointer hidden" id="choiceMeridian" onclick="choosePath('meridian')">
     Meridian Path
    </span>
   </div>
  </div>
  <!-- Input & Buttons -->
  <div class="input-section mb-6 flex flex-col sm:flex-row items-center gap-4 justify-center">
   <input class="flex-grow max-w-xs px-4 py-2 bg-[#5B2A2A] border-2 border-[#CFAE6A] text-[#F6F1E0] rounded-lg shadow-inner shadow-black/25 placeholder-[#F6F1E0] focus:outline-none focus:ring-2 focus:ring-[#CFAE6A] transition-colors duration-300 hidden" id="guessInput" placeholder="Enter your guess" type="text"/>
   <button class="path-btn hidden" id="submitBtn" onclick="checkGuess()">
    Submit
   </button>
   <button class="path-btn hidden" id="nextBtn" onclick="nextPuzzle()">
    Next
   </button>
  </div>
  <!-- Overlay for Image Preview -->
  <div class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-40" id="overlay" onclick="hideOverlay()">
   <img class="max-w-[90%] max-h-[90%] border-4 border-white shadow-xl" id="overlayImg" src=""/>
  </div>
  <!-- Toast Message -->
  <div class="fixed inset-0 flex items-end justify-center pb-8 pointer-events-none" id="toast">
   <div class="bg-[#5B2A2A] border-2 border-[#CFAE6A] text-[#F6F1E0] font-semibold px-6 py-3 rounded-lg shadow-lg hidden" id="toastInner" onclick="this.classList.add('hidden')">
   </div>
  </div>
  <!-- Hint Box -->
  <div class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" id="hintBox" onclick="hideHint()">
   <div class="relative bg-[#E3D1B5] text-[#333333] border-2 border-[#CFAE6A] rounded-lg shadow-lg p-6 prose max-w-md">
    <p id="hintText">
    </p>
    <!-- Brass-corner accents for a Victorian “frame” -->
    <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-[#CFAE6A]">
    </div>
    <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-[#CFAE6A]">
    </div>
    <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-[#CFAE6A]">
    </div>
    <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-[#CFAE6A]">
    </div>
   </div>
  </div>
  <!-- CryptoJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js">
  </script>
  <!-- Game Logic -->
  <script>
   let puzzles = [];
let pathProgress = { intro: 1, parallel: 1, meridian: 1, final: 1 };
['intro', 'parallel', 'meridian', 'final'].forEach(p => 
  pathProgress[p] = parseInt(localStorage.getItem('progress_' + p)) || 1
);

  let currentPath = 'intro';
  let currentStage = 1;

  const listFor = p =>
    puzzles
      .filter(x => x.path === p)
      .sort((a, b) => a.stage - b.stage);

  const introCount = () =>
    listFor('intro').length;

fetch('content.json?nocache=${Date.now()}')
  .then(response => {
    if (!response.ok) throw new Error("Failed to load content.json");
    return response.json();
  })
  .then(data => {
    if (!Array.isArray(data)) throw new Error("Invalid puzzle data format");
    puzzles = data;
    init();
  })
  .catch(err => {
    console.error("Error loading puzzle data:", err);
    alert("Failed to load puzzle data. Check console for details.");
  });


function init() {
  ['intro', 'parallel', 'meridian', 'final'].forEach(p => {
    const m = listFor(p).length;
    if (pathProgress[p] > m) {
      pathProgress[p] = 1;
      localStorage.setItem('progress_' + p, '1');
    }
  });

  const parallelComplete = pathProgress.parallel > listFor('parallel').length;
  const meridianComplete = pathProgress.meridian > listFor('meridian').length;

  if (pathProgress.final >= 1 && parallelComplete && meridianComplete) {
    loadStageFor('final');
  } else if (pathProgress.intro <= listFor('intro').length) {
    loadStageFor('intro');
  } else if (!parallelComplete) {
    loadStageFor('parallel');
  } else if (!meridianComplete) {
    loadStageFor('meridian');
  } else {
    document.getElementById('textContent').innerHTML =
      '<div class="instructions-text text-center">You’ve completed all paths. Thank you for playing!</div>';
  }
}





function loadStageFor(path) {
  currentPath = path;
  const lst = listFor(path);
  const u = Math.min(pathProgress[path], lst.length);

  currentStage = lst[u - 1].stage;  // FIXED: make sure currentStage aligns to the correct object

  const btn = document.getElementById('togglePathBtn');
  if (path === 'intro' || path === 'final') {
    btn.classList.add('hidden');
  } else {
    btn.classList.remove('hidden');
    btn.textContent = path === 'parallel'
      ? 'Switch to Meridian'
      : 'Switch to Parallel';
  }

  populateStages();
  loadStage();
}

function togglePath() {
  const otherPath = currentPath === 'parallel' ? 'meridian' : 'parallel';

  // Get list and progress for the other path
  const otherList = listFor(otherPath);
  const nextStage = Math.min(pathProgress[otherPath], otherList.length);
  const nextStageObj = otherList.find(p => p.stage === nextStage);

  if (nextStageObj) {
    currentStage = nextStageObj.stage;
    loadStageFor(otherPath);
  } else {
    showToast("No progress in the other path yet.", false);
  }
}
  function populateStages() {
    const sel = document.getElementById('stageSelect');
    const lst = listFor(currentPath);
    sel.innerHTML = '';

    let cnt = Math.min(pathProgress[currentPath], lst.length);
    if (cnt < 1) cnt = 1;

    for (let i = 0; i < cnt; i++) {
      const p = lst[i];
      const o = document.createElement('option');
      o.value = p.stage;
      o.text = p.title || `Stage ${p.stage}`;
      sel.add(o);
    }

    sel.value = currentStage;
  }

  function onStageChange(v) {
    currentStage = parseInt(v);
    populateStages();
    loadStage();
  }
  
  function isPathComplete(path) {
  const maxStage = listFor(path).length;
  return pathProgress[path] >= maxStage;
}

function loadStage() {
  window.scrollTo(0, 0);

  const puz = puzzles.find(x =>
    x.path === currentPath && x.stage === currentStage
  );
  if (!puz) return;

  const txt = document.getElementById('textContent');
  const imgs = document.querySelector('.images');
  const img1 = document.getElementById('img1');
  const img2 = document.getElementById('img2');
  const inp = document.getElementById('guessInput');
  const sb = document.getElementById('submitBtn');
  const nb = document.getElementById('nextBtn');
  const cp = document.getElementById('choiceParallel');
  const cm = document.getElementById('choiceMeridian');

  const isFinalParallel = currentPath === 'parallel' && currentStage === 17;
  const isFinalMeridian = currentPath === 'meridian' && currentStage === 15;
  const isFinalEpilogue = currentPath === 'final' && currentStage === 3;

  // Special case: final epilogue (no controls)
if (isFinalEpilogue) {
  txt.innerHTML = puz.htmlContent;
  txt.classList.remove('hidden');

  const hasImages = Array.isArray(puz.images) && puz.images.some(src => src && src.trim() !== "");
  if (hasImages) {
    img1.src = puz.images[0] ? `assets/${puz.images[0]}` : "";
    img2.src = puz.images[1] ? `assets/${puz.images[1]}` : "";
    imgs.classList.remove('hidden');
  } else {
    img1.src = "";
    img2.src = "";
    imgs.classList.add('hidden');
  }

  inp.classList.add('hidden');
  sb.classList.add('hidden');
  cp.classList.add('hidden');
  cm.classList.add('hidden');

  nb.textContent = "FINISH";
  nb.classList.remove('hidden');
  nb.onclick = showFinishModal;

  return;
}


  // Final stage of either path — wait for both to finish
  if (isFinalParallel || isFinalMeridian) {
    const otherComplete = isFinalParallel
      ? isPathComplete('meridian')
      : isPathComplete('parallel');

    txt.innerHTML = puz.htmlContent;
    txt.classList.remove('hidden');

	const hasImages = Array.isArray(puz.images) && puz.images.some(src => src && src.trim() !== "");
	if (hasImages) {
	  img1.src = puz.images[0] ? `assets/${puz.images[0]}` : "";
	  img2.src = puz.images[1] ? `assets/${puz.images[1]}` : "";
	  imgs.classList.remove('hidden');
	} else {
	  img1.src = "";
	  img2.src = "";
	  imgs.classList.add('hidden');
	}


    inp.classList.add('hidden');
    sb.classList.add('hidden');

    if (otherComplete) {
      nb.classList.remove('hidden');
      nb.onclick = () => {
        pathProgress['final'] = 1;
        localStorage.setItem('progress_final', '1');
        loadStageFor('final');
      };
    } else {
      nb.classList.add('hidden');
      txt.innerHTML += `<div class="instructions-text text-center text-xl mt-6">You've completed one path. To continue, return and complete the other path.</div>`;
    }

    return;
  }

  // Regular logic
  const ans = (puz.hasAnswer !== false && !puz.hasChoice);
  const cho = (puz.hasChoice === true);

  let h = puz.htmlContent || "";
  if (cho) {
    h += `
      <div class="mt-4 flex justify-center gap-8">
        <span onclick="choosePath('parallel')" class="path-btn mx-2">
          Parallel Path
        </span>
        <span onclick="choosePath('meridian')" class="path-btn mx-2">
          Meridian Path
        </span>
      </div>
    `;
  }
  txt.innerHTML = h;
  txt.classList.toggle('hidden', h.trim() === "");

	const hasImages = Array.isArray(puz.images) && puz.images.some(src => src && src.trim() !== "");
	if (hasImages) {
	  img1.src = puz.images[0] ? `assets/${puz.images[0]}` : "";
	  img2.src = puz.images[1] ? `assets/${puz.images[1]}` : "";
	  imgs.classList.remove('hidden');
	} else {
	  img1.src = "";
	  img2.src = "";
	  imgs.classList.add('hidden');
	}


  inp.classList.toggle('hidden', !ans);
  sb.classList.toggle('hidden', !ans);
  nb.classList.toggle('hidden', ans || cho);
  // rename “Next” → “Begin” on the very first intro stage
if (currentPath === 'intro' && currentStage === 1) {
  nb.textContent = 'Begin your adventure!';
} else {
  nb.textContent = 'Next';
}
  cp.classList.toggle('hidden', !cho);
  cm.classList.toggle('hidden', !cho);
  inp.value = '';
}


  function checkGuess() {
    const v = document.getElementById('guessInput')
      .value
      .trim()
      .toLowerCase();
    const h = CryptoJS.SHA256(v).toString();

    const puz = puzzles.find(x =>
      x.path === currentPath && x.stage === currentStage
    );
    const val = puz.answers || (puz.answerHash ? [puz.answerHash] : []);

    if (val.includes(h)) {
      showToast('Correct!', true);
      advanceProgress();
      setTimeout(autoAdvance, 500);
    } else {
      showToast('Incorrect', false);
    }
  }

  function nextPuzzle() {
    advanceProgress();
    setTimeout(autoAdvance, 200);
  }

  function advanceProgress() {
    const lst = listFor(currentPath);
    const idx = lst.findIndex(x => x.stage === currentStage);

    if (
      idx === pathProgress[currentPath] - 1 &&
      pathProgress[currentPath] < lst.length
    ) {
      pathProgress[currentPath]++;
      localStorage.setItem(
        'progress_' + currentPath,
        pathProgress[currentPath]
      );
    }

    if (currentPath === 'intro' && idx + 1 === lst.length) {
      loadStageFor('parallel');
    }
  }

  function autoAdvance() {
    populateStages();
    const lst = listFor(currentPath);
    const idx = lst.findIndex(x => x.stage === currentStage);

    if (idx + 1 < lst.length) {
      onStageChange(lst[idx + 1].stage);
    }
  }

  function showToast(msg, ok) {
    const inner = document.getElementById('toastInner');
    inner.textContent = msg;
    inner.classList.remove('hidden');
    inner.classList.toggle('bg-red-600', !ok);
    setTimeout(() => inner.classList.add('hidden'), 1500);
  }

  function showOverlay(src) {
    const ov = document.getElementById('overlay');
    document.getElementById('overlayImg').src = src;
    ov.classList.remove('hidden');
  }

  function hideOverlay() {
    document.getElementById('overlay').classList.add('hidden');
  }

function showHint() {
  const puz = puzzles.find(x =>
    x.path === currentPath && x.stage === currentStage
  );
  if (!puz || !puz.hint) return;

  // Inject your HTML‐formatted hint
  const hintEl = document.getElementById('hintText');
  hintEl.innerHTML = puz.hint;

  // Show the modal
  document.getElementById('hintBox').classList.remove('hidden');
  setTimeout(() => document.addEventListener('click', onAnyClickToHide), 0);
}

  function onAnyClickToHide() {
    hideHint();
    document.removeEventListener('click', onAnyClickToHide);
  }

  function hideHint() {
    document.getElementById('hintBox')
      .classList.add('hidden');
  }

  function choosePath(p) {
    loadStageFor(p);
  }

  function resetProgress() {
    if (!confirm('Are you sure you want to reset all progress?'))
      return;

	['intro', 'parallel', 'meridian', 'final'].forEach(p => {
	  localStorage.setItem('progress_' + p, '1');
	  pathProgress[p] = 1;
	});


    loadStageFor('intro');
	document.getElementById('nextBtn').textContent = "Next";
	document.getElementById('nextBtn').onclick = nextPuzzle;

  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const sb = document.getElementById('submitBtn');
      const nb = document.getElementById('nextBtn');

      if (!sb.classList.contains('hidden')) {
        checkGuess();
      } else if (!nb.classList.contains('hidden')) {
        nextPuzzle();
      }
    }
  });
  
  function showFinishModal() {
  document.getElementById('finishModal').classList.remove('hidden');
}

function hideFinishModal() {
  document.getElementById('finishModal').classList.add('hidden');
}
  </script>
  <!-- Finish Modal -->
  <div class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50" id="finishModal">
   <div class="relative bg-[#E3D1B5] text-[#333333] border-2 border-[#CFAE6A] rounded-lg shadow-lg p-6 max-w-lg text-center">
    <p class="text-xl mb-4">
     Thank you for playing!
    </p>
    <p class="text-lg mb-4">
     The Circle turns again - now through you.
    </p>
    <button class="mt-4 px-4 py-2 bg-[#5B2A2A] text-[#F6F1E0] rounded-lg border border-[#CFAE6A] hover:bg-[#4A2020] transition" onclick="hideFinishModal()">
     Close
    </button>
    <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-[#CFAE6A]">
    </div>
    <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-[#CFAE6A]">
    </div>
    <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-[#CFAE6A]">
    </div>
    <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-[#CFAE6A]">
    </div>
   </div>
  </div>
 </body>
